<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeMind</title><style>
:root{color-scheme:dark;--side:#171717;--bg:#212121;--text:#eee;--sub:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}.app{height:100dvh;display:flex;overflow:hidden}.side{width:260px;flex:none;background:var(--side);padding:14px 10px;display:flex;flex-direction:column}.brand{padding:4px 8px 20px;font-size:16px;font-weight:650}.brand i,.logo{font-style:normal;border:1px solid #666;border-radius:50%;display:inline-grid;place-items:center}.brand i{width:25px;height:25px;margin-right:9px}.new,.nav,.hist{height:40px;border:0;border-radius:8px;padding:0 11px;background:transparent;color:#ddd;text-align:left;font:inherit;cursor:pointer}.new{border:1px solid #393939}.nav{background:#272727;margin-top:8px}.expert-open{height:40px;border:1px solid #393939;border-radius:8px;padding:0 11px;background:#202020;color:#ddd;text-align:left;font:inherit;cursor:pointer;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.label{font-size:12px;color:#777;padding:25px 10px 8px}.hist{height:auto;padding:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hist:hover{background:#252525}.spacer{flex:1}.local{border-top:1px solid #333;padding:14px 9px;color:#ddd;font-size:12px}.local small{display:block;color:#888;padding-left:17px;margin-top:3px}.dot{display:inline-block;width:7px;height:7px;background:#8bcf73;border-radius:50%;margin-right:8px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top b{font-size:16px}.top small{color:#999;margin-left:7px}.connected{font-size:11px;color:#999}.thread{flex:1;overflow:auto;padding:0 22px 24px}.welcome{max-width:790px;margin:clamp(70px,16vh,160px) auto 0;text-align:center}.welcome[hidden]{display:none}.logo{width:44px;height:44px;font-size:22px;color:#ddd;margin-bottom:17px}.welcome h1{font-size:27px;font-weight:550;margin:0 0 8px}.welcome p{color:#999;margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:38px;text-align:left}.card{background:#262626;border:1px solid #383838;border-radius:12px;color:#eee;padding:15px;min-height:95px;text-align:left;cursor:pointer}.card b{display:block;margin-bottom:8px}.card small{color:#999}.messages{max-width:790px;margin:28px auto}.msg{margin:0 0 25px;line-height:1.72;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{margin-left:auto;width:max-content;max-width:80%;background:#303030;border-radius:19px;padding:10px 15px}.assistant{display:flex;gap:13px}.mark{flex:none;width:27px;height:27px;border:1px solid #666;border-radius:50%;display:grid;place-items:center}.answer{min-width:0}.answer a,.source a{color:#a6c8ff;text-decoration:none}.source-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.source{border:1px solid #444;border-radius:9px;padding:8px 10px;background:#292929;max-width:240px;font-size:11px}.source a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source small{color:#888}.media-card{width:min(245px,100%);padding:0;overflow:hidden}.media-card img{display:block;width:100%;max-height:180px;object-fit:cover;background:#191919}.media-title{display:block;padding:8px 10px 4px}.media-meta{display:block;padding:0 10px 9px;color:#999;font-size:10px}.download-card{display:inline-block;border:1px solid #444;border-radius:9px;padding:10px 13px;background:#292929;margin:10px 8px 0 0}.download-card a{color:#a6c8ff;text-decoration:none}.status{color:#aaa;font-size:13px;padding:8px 0;display:flex;gap:9px;align-items:center}.spin{width:14px;height:14px;border:2px solid #444;border-top-color:#eee;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.search{background:#272727;border:1px solid #3b3b3b;border-radius:10px;padding:11px 13px;margin:8px 0;color:#ccc;font-size:12px}.search small{display:block;color:#999;margin-top:5px}.compose-wrap{padding:8px 20px 12px}.compose{max-width:790px;margin:auto;background:#303030;border:1px solid #4b4b4b;border-radius:24px;padding:12px 13px}.compose textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:#eee;font:15px system-ui;min-height:34px;max-height:150px}.tools{display:flex;align-items:center;gap:8px}.tools button{border:0;border-radius:18px;padding:7px 11px;background:transparent;color:#aaa;cursor:pointer}.tools button:hover{background:#414141}.tools .on{background:#39412f;color:#d1eda7}.right{margin-left:auto;color:#888;font-size:11px}.send{background:#eee!important;color:#222!important;width:32px;height:32px;padding:0!important;font-size:20px}.foot{text-align:center;color:#777;font-size:10px;padding:8px}.toast{position:fixed;bottom:20px;left:50%;background:#444;padding:10px;border-radius:8px;display:none}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:5;padding:16px}.modal.open{display:grid}.expert-panel{width:min(560px,100%);max-height:85vh;overflow:auto;background:#252525;border:1px solid #444;border-radius:16px;padding:20px;box-shadow:0 16px 60px #0008}.expert-panel h2{margin:0 0 7px;font-size:20px}.expert-panel p{color:#aaa;line-height:1.6}.expert-list{display:grid;gap:8px;margin:14px 0}.expert-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:11px;border:1px solid #444;border-radius:10px;background:#2d2d2d;color:#eee;cursor:pointer}.expert-choice.active{border-color:#8aa9dc}.expert-choice small{display:block;color:#999;margin-top:4px}.expert-create{display:flex;gap:8px;margin-top:16px}.expert-create input{min-width:0;flex:1;border:1px solid #4b4b4b;border-radius:9px;background:#191919;color:#eee;padding:10px;font:inherit}.expert-create button,.expert-close{border:0;border-radius:9px;background:#e8e8e8;color:#222;padding:10px 13px;cursor:pointer}.expert-close{background:#393939;color:#ddd}.expert-actions{display:flex;ju </style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><i>F</i>ForgeMind</div><button class="new" id="new">＋　新建对话 <span style="float:right;color:#777;font-size:11px">Ctrl K</span></button><button class="nav">⌕　搜索对话</button><button class="expert-open" id="expertOpen">✳　领域专家：未启用</button><div class="label">最近</div><div id="history"></div><div class="spacer"></div><div class="local"><span class="dot"></span>本地模型<small>对话历史保存在此浏览器</small></div></aside><main class="main"><header class="top"><div><button class="menu" id="menu">☰</button><b>ForgeMind</b><small>本地版</small></div><span class="connected">●　本机已连接</span></header><section class="thread" id="thread"><div class="welcome" id="welcome"><div class="logo">F</div><h1>今天有什么可以帮你？</h1><p>本地 AI 助手，可对话、联网查资料、协助编写代码。</p><div class="cards"><button class="card" data-p="用简单的话解释一下大型语言模型是怎么工作的。"><b>✳　解释一个概念</b><small>用清晰步骤讲明白</small></button><button class="card" data-p="帮我写一个 Python 函数，检查字符串是否是回文。"><b>⌘　写一段代码</b><small>从小功能开始动手</small></button><button class="card" data-p="联网搜索 MiniMind 项目的最新进展，并附上来源链接。"><b>⌕　搜索最新信息</b><small>整理网页来源与要点</small></button></div></div><div class="messages" id="messages"></div></section><div class="compose-wrap"><form class="compose" id="form"><textarea id="input" rows="1" placeholder="给 ForgeMind 发送消息"></textarea><div class="tools"><button type="button" id="search">⌕　联网搜索</button><button type="button" id="attach">＋　附件</button><span class="right">本地 7B</span><button class="send" type="submit" id="send">↑</button></div></form><div class="foot">ForgeMind 可能会出错。重要信息请核对来源。 · 本地运行</div></div></main></div><div class="toast" id="toast"></div><div class="modal" id="expertModal"><section class="expert-panel"><h2>领域专家</h2><p>创建专家后会并行搜索该领域的基础概念、方法指标、案例和风险，并把网页来源存入本地知识库。选中专家后，相关问题优先检索知识库；超出领域时自动全网搜索。</p><div class="expert-list" id="expertList"><span style="color:#999">正在读取专家列表…</span></div><div class="expert-create"><input id="expertDomain" maxlength="80" placeholder="输入一个专业领域，例如：股票量价分析"><button id="researchExpert">研究并创建</button></div><div id="expertProgress" style="color:#aaa;font-size:12px;margin-top:9px"></div><div class="expert-actions"><button class="expert-close" id="expertClose">关闭</button></div></section></div><script>
const $=s=>document.querySelector(s),msgs=$("#messages"),input=$("#input"),welcome=$("#welcome");let chats=JSON.parse(localStorage.getItem("fm.chats")||"[]"),current=localStorage.getItem("fm.current"),busy=false,experts=[],activeExpertId=localStorage.getItem("fm.expertId")||"";if(!chats.some(c=>c.id===current))current=null;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cur(){return chats.find(c=>c.id===current)}
function save(){localStorage.setItem("fm.chats",JSON.stringify(chats));if(current)localStorage.setItem("fm.current",current)}
function md(t){const blocks=[];const fence=String.fromCharCode(96).repeat(3);const codeRe=new RegExp(fence+"([^\\n]*)\\n([\\s\\S]*?)"+fence,"g");let s=esc(t).replace(codeRe,(_,lang,code)=>{blocks.push({lang:esc(lang||"代码"),code:code});return "@@CODE"+(blocks.length-1)+"@@"});s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/\n/g,"<br>");return s.replace(/@@CODE(\d+)@@/g,(_,i)=>'<pre><small>'+blocks[i].lang+'</small><br><code>'+esc(blocks[i].code)+'</code></pre>')}
function renderCards(sources,files){let cards=(sources||[]).map(s=>{let media=s.media_type==="image"||s.media_type==="video";let safeMedia=/^https:\/\//i.test(s.media_url||"")?(s.media_url):"";let safeThumb=/^https:\/\//i.test(s.thumbnail||"")?(s.thumbnail):safeMedia;let preview=media&&safeThumb?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(safeThumb)+'" alt="'+esc(s.title||"搜索结果预览")+'"></a>':"";let meta=s.media_type==="video"?"视频 · "+(s.duration||"打开来源播放"):(s.width&&s.height?s.width+" × "+s.height:"图片来源");return '<div class="source '+(media?"media-card":"")+'">'+preview+'<a class="'+(media?"media-title":"")+'" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title||s.url)+'</a><small class="'+(media?"media-meta":"")+'">'+esc(media?meta:(s.published_date||"网页来源"))+'</small></div>'}).join("");cards+=(files||[]).map(f=>'<div class="download-card">↓　<a href="'+esc(f.url)+'" download="'+esc(f.name)+'">下载 '+esc(f.format.toUpperCase())+' 文件</a></div>').join("");return cards}
function draw(){let c=cur();msgs.innerHTML="";welcome.hidden=!!(c&&c.m.length);if(!c)return;c.m.forEach(m=>{let d=document.createElement("div");d.className="msg "+(m.r==="user"?"user":"assistant");if(m.r==="user")d.textContent=m.t;else{d.innerHTML='<span class="mark">F</span><div class="answer">'+md(m.t)+'<div class="source-list">'+renderCards(m.s,m.f)+'</div></div>'}msgs.append(d)});$("#thread").scrollTop=$("#thread").scrollHeight;drawHistory()}
function drawHistory(){let h=$("#history");h.innerHTML="";chats.slice().reverse().forEach(c=>{let b=document.createElement("button");b.className="hist";b.textContent=c.title;b.onclick=()=>{current=c.id;save();draw()};h.append(b)})}
function updateExpertLabel(){let e=experts.find(x=>x.id===activeExpertId);$("#expertOpen").textContent="✳　领域专家："+(e?e.domain:"未启用")}
async function refreshExperts(){try{let r=await fetch("/api/experts");let d=await r.json();experts=d.experts||[];if(!activeExpertId&&experts.length===1){activeExpertId=experts[0].id;localStorage.setItem("fm.expertId",activeExpertId)}if(activeExpertId&&!experts.some(e=>e.id===activeExpertId)){activeExpertId="";localStorage.removeItem("fm.expertId")}renderExperts();updateExpertLabel()}catch(e){experts=[];renderExperts();updateExpertLabel()}}
function renderExperts(){let host=$("#expertList");if(!host)return;host.innerHTML="";let off=document.createElement("button");off.className="expert-choice"+(!activeExpertId?" active":"");off.innerHTML="<span><b>普通助手</b><small>不限定领域</small></span><span>›</span>";off.onclick=()=>selectExpert("");host.append(off);if(!experts.length){let note=document.createElement("div");note.style.cssText="color:#888;font-size:12px;padding:8px 2px";note.textContent="还没有专家。输入领域即可开始研究。";host.append(note)}experts.forEach(e=>{let b=document.createElement("button");b.className="expert-choice"+(e.id===activeExpertId?" active":"");b.innerHTML="<span><b>"+esc(e.domain)+"</b><small>"+(e.source_count||0)+" 条来源 · 最近研究 "+esc(e.researched_at||"")+"</small></span><span>"+(e.id===activeExpertId?"已启用":"选择")+" ›</span>";b.onclick=()=>selectExpert(e.id);host.append(b)})}
function selectExpert(id){activeExpertId=id;id?localStorage.setItem("fm.expertId",id):localStorage.removeItem("fm.expertId");renderExperts();updateExpertLabel();$("#expertModal").classList.remove("open")}
function toast(t){let x=$("#toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function start(){current=null;localStorage.removeItem("fm.current");draw();updateExpertLabel();refreshExperts();input.focus()}
function setstatus(box,t){box.textContent=t}
async function ask(text){text=(text||input.value).trim();if(!text||busy)return;let c=cur();if(!c){c={id:Date.now()+"",title:"新对话",m:[]};chats.push(c);current=c.id}c.m.push({r:"user",t:text});if(c.title==="新对话")c.title=text.slice(0,24);save();draw();updateExpertLabel();refreshExperts();input.value="";busy=true;$("#send").disabled=true;let explicitSearch=/(搜索|联网|查一下|查询|查找|搜一下|帮我查|帮我搜索|检索|GitHub)/i.test(text),followup=!explicitSearch&&/(你为什么(?:不能|不给|不|没|没有|刚才)|为什么(?:不能|不|没|没有|刚才|这样|这么)|为啥|刚才|上一条|上一个回答|你说的|这个回答|前面那个|继续|改一下|给它加|像话吗|答非所问|跑题|不相关)/i.test(text);let web=explicitSearch||(!followup&&($("#search").classList.contains("on")||/(最新|今天|今日|目前|现在|实时|近期|新闻|股价|涨跌|行情|天气|股票|股市|指数|建议|推荐|怎么选|哪个好|哪家|对比|比较|示意图|配图|图片|插图|视频|短片)/i.test(text)));if(followup)$("#search").classList.remove("on");let row=document.createElement("div");row.className="msg assistant";row.innerHTML='<span class="mark">F</span><div class="answer"></div>';msgs.append(row);let box=row.querySelector(".answer"),status=document.createElement("div");status.className="status";status.innerHTML='<span class="spin"></span><span></span>';box.append(status);let statusText=status.lastChild;if(web){let card=document.createElement("div");card.className="search";card.innerHTML="<b>⌕　正在 Web search</b><small>正在查找网页并整理来源…</small>";box.insertBefore(card,status);status.card=card}let sources=[],artifacts=[],answer="",startAt=Date.now(),tick=setInterval(()=>setstatus(statusText,(web?"正在 Web search":"正在思考")+" · "+Math.floor((Date.now()-startAt)/1000)+" 秒"),1000);
try{let hist=c.m.slice(0,-1).map(m=>({role:m.r==="user"?"user":"assistant",content:m.t}));let res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history:hist,search:web,expert_id:activeExpertId||null})});if(!res.ok)throw Error((await res.json()).error||"HTTP "+res.status);let reader=res.body.getReader(),dec=new TextDecoder(),buf="";while(true){let x=await reader.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let i;while((i=buf.indexOf("\n\n"))>=0){let ch=buf.slice(0,i);buf=buf.slice(i+2);let line=ch.split("\n").find(v=>v.startsWith("data: "));if(!line)continue;let e=JSON.parse(line.slice(6));if(e.type==="status"){setstatus(statusText,e.message);if(e.phase==="web_search"&&!status.card){let card=document.createElement("div");card.className="search";card.innerHTML="<b>⌕　正在 Web search</b><small>专家范围之外，正在搜索全网…</small>";box.insertBefore(card,status);status.card=card}if(e.phase==="knowledge"&&!status.card){let card=document.createElement("div");card.className="search";card.innerHTML="<b>✳　专家知识库</b><small>正在检索已保存的专业资料…</small>";box.insertBefore(card,status);status.card=card}if(e.phase==="answering"&&status.card){status.card.querySelector("b").textContent="✓　检索完成";status.card.querySelector("small").textContent=sources.length?"已找到 "+sources.length+" 条资料，正在整理回答。":"没有找到相关资料，正在整理回答。"}}if(e.type==="search_done"){sources=e.sources||[];setstatus(statusText,sources.length?"已找到 "+sources.length+" 个网页来源":"搜索未返回可用来源");if(status.card){status.card.querySelector("b").textContent=sources.length?"✓　Web search 完成":"!　Web search 未找到来源";status.card.querySelector("small").textContent=sources.length?"来源："+(e.provider||"网页搜索")+" · 共 "+sources.length+" 条":(e.error||"搜索服务没有返回可用网页")}}if(e.type==="done"){answer=e.answer||"模型返回了空内容";sources=e.sources||sources;artifacts=e.artifacts||artifacts}if(e.type==="error")throw Error(e.message||"模型请求失败")}}clearInterval(tick);row.remove();c.m.push({r:"assistant",t:answer,s:sources,f:artifacts});save();draw()}catch(e){clearInterval(tick);status.querySelector(".spin")?.remove();setstatus(statusText,"请求未完成："+e.message);toast("这次请求没有完成")}finally{busy=false;$("#send").disabled=false;input.focus()}}
$("#form").onsubmit=e=>{e.preventDefault();ask()};input.oninput=()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"};input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#form").requestSubmit()}};$("#new").onclick=start;$("#expertOpen").onclick=()=>{$("#expertModal").classList.add("open");refreshExperts()};$("#expertClose").onclick=()=>$("#expertModal").classList.remove("open");$("#expertModal").onclick=e=>{if(e.target.id==="expertModal")e.currentTarget.classList.remove("open")};$("#researchExpert").onclick=async()=>{let domain=$("#expertDomain").value.trim();if(!domain){toast("先输入专家领域");return}let button=$("#researchExpert"),progress=$("#expertProgress");button.disabled=true;progress.textContent="正在并行搜索四组专题并保存来源…";try{let r=await fetch("/api/experts/research",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({domain})});let d=await r.json();if(!r.ok)throw Error(d.error||"研究失败");await refreshExperts();selectExpert(d.expert.id);$("#expertDomain").value="";progress.textContent="研究完成，已保存 "+(d.expert.source_count||0)+" 条来源。";toast("专家已创建并启用")}catch(e){progress.textContent="创建失败："+e.message;toast("专家研究没有完成")}finally{button.disabled=false}};$("#search").onclick=()=>$("#search").classList.toggle("on");$("#attach").textContent="↓　导出";$("#attach").onclick=()=>toast("直接说“把上面内容生成 PDF、EPUB 或 TXT”即可下载");$("#menu").onclick=()=>$("#side").classList.toggle("open");document.querySelectorAll(".card").forEach(b=>b.onclick=()=>ask(b.dataset.p));document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();start()}});draw();updateExpertLabel();refreshExperts();
</script></body></html>
